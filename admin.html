<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Admin Panel — Booking Dashboard</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 360px;
      text-align: center;
    }
    .login-box h1 { font-size: 24px; margin-bottom: 8px; color: #f8fafc; }
    .login-box p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #f8fafc;
      margin-bottom: 16px;
    }
    .login-box button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #facc15);
      color: #111827;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: #fca5a5; font-size: 13px; margin-top: 12px; min-height: 18px; }

    #admin-panel { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; gap: 12px; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 28px; color: #f8fafc; }
    .actions { display: flex; gap: 10px; }
    .actions button {
      padding: 10px 14px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      border-radius: 12px;
      cursor: pointer;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
    }
    .stat-label { color: #94a3b8; font-size: 13px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: #f8fafc; }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
    }
    .panel h2 { margin-bottom: 16px; font-size: 20px; color: #f8fafc; }
    .loading, .empty { color: #94a3b8; padding: 12px 0; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #334155;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th { color: #cbd5e1; font-weight: 600; }
    td { color: #e2e8f0; }
    .muted { color: #94a3b8; }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .cash.pending { background: #422006; color: #fdba74; }
    .cash.received { background: #052e16; color: #86efac; }
    .submitted { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .completed { background: #0c4a6e; color: #7dd3fc; }
    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .row-actions button {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      cursor: pointer;
      font-size: 12px;
    }
    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<section id="login-screen">
<div class="login-box">
<h1>Temple Admin Panel</h1>
<p>Enter the admin password to view bookings.</p>
<input id="password-input" placeholder="Enter admin password" type="password"/>
<button onclick="login()">Login</button>
<div class="error" id="login-error"></div>
</div>
</section>
<main id="admin-panel">
<div class="topbar">
<h1>Booking Dashboard</h1>
<div class="actions">
<button onclick="loadAll()">Refresh</button>
<button onclick="logout()">Logout</button>
</div>
</div>
<section class="stats">
<div class="stat-card">
<div class="stat-label">Total Bookings</div>
<div class="stat-value" id="stat-total-bookings">0</div>
</div>
<div class="stat-card">
<div class="stat-label">Cash Pending</div>
<div class="stat-value" id="stat-cash-pending">0</div>
</div>
<div class="stat-card">
<div class="stat-label">Cash Received</div>
<div class="stat-value" id="stat-cash-received">0</div>
</div>
<div class="stat-card">
<div class="stat-label">Completed Services</div>
<div class="stat-value" id="stat-completed-bookings">0</div>
</div>
</section>
<section class="panel">
<h2>Bookings</h2>
<div class="table-wrap" id="bookings-body">
<div class="loading">Loading…</div>
</div>
</section>
</main>
<script>
    const BASE = "https://mandir-website-baglamukhimata.onrender.com";
    let adminToken = "";

    async function login() {
      const pw = document.getElementById("password-input").value.trim();
      if (!pw) return;

      const res = await fetch(`${BASE}/admin/dashboard-summary`, {
        headers: { "x-admin-token": pw }
      });

      if (res.ok) {
        adminToken = pw;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        loadAll();
      } else {
        document.getElementById("login-error").textContent = "Wrong password. Try again.";
      }
    }

    document.getElementById("password-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    function logout() {
      adminToken = "";
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("admin-panel").style.display = "none";
      document.getElementById("password-input").value = "";
      document.getElementById("login-error").textContent = "";
    }

    async function apiFetch(path, options = {}) {
      const res = await fetch(`${BASE}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "x-admin-token": adminToken,
          ...(options.headers || {})
        }
      });

      if (!res.ok) {
        throw new Error(await res.text());
      }

      return res.json();
    }

    function fmtAmount(paise) {
      const rupees = Number(paise || 0) / 100;
      return rupees > 0
        ? "₹" + rupees.toLocaleString("en-IN", { minimumFractionDigits: 2 })
        : "Cash later";
    }

    function cashBadge(status) {
      const normalized = (status || "").toLowerCase();
      const cls = normalized === "cash received" ? "cash received" : "cash pending";
      return `<span class="badge ${cls}">${status || "cash pending"}</span>`;
    }

    function bookingBadge(status) {
      const normalized = (status || "").toLowerCase();
      const cls = normalized === "completed" ? "completed" : "submitted";
      return `<span class="badge ${cls}">${status || "submitted"}</span>`;
    }

    async function loadSummary() {
      const s = await apiFetch("/admin/dashboard-summary");
      document.getElementById("stat-total-bookings").textContent = s.totalBookings || 0;
      document.getElementById("stat-cash-pending").textContent = s.cashPendingBookings || 0;
      document.getElementById("stat-cash-received").textContent = s.cashReceivedBookings || 0;
      document.getElementById("stat-completed-bookings").textContent = s.completedBookings || 0;
    }

    async function updateBooking(bookingId, updates) {
      await apiFetch(`/admin/bookings/${bookingId}/update`, {
        method: "POST",
        body: JSON.stringify(updates)
      });
      await loadAll();
    }

    async function loadBookings() {
      const el = document.getElementById("bookings-body");
      el.innerHTML = '<div class="loading">Loading…</div>';

      try {
        const data = await apiFetch("/admin/bookings");

        if (!data.items.length) {
          el.innerHTML = '<div class="empty">No bookings found.</div>';
          return;
        }

        el.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Pandit</th>
                <th>Date</th>
                <th>Time</th>
                <th>Location</th>
                <th>Service Price</th>
                <th>Cash Status</th>
                <th>Service Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map((b) => `
                <tr>
                  <td><strong>${b.bookingId || b.id}</strong></td>
                  <td>${b.name}<div class="muted">${b.email && b.email !== "—" ? b.email : ""}</div></td>
                  <td>${b.phone}</td>
                  <td>${b.service}</td>
                  <td>${b.pandit || "—"}</td>
                  <td>${b.date || "—"}</td>
                  <td>${b.time || "—"}</td>
                  <td>${b.location}<div class="muted">${b.address && b.address !== "—" ? b.address : ""}</div></td>
                  <td>${fmtAmount(b.amount)}</td>
                  <td>${cashBadge(b.paymentStatus)}</td>
                  <td>${bookingBadge(b.bookingStatus)}</td>
                  <td>
                    <div class="row-actions">
                      <button onclick="updateBooking('${b.bookingId || b.id}', { paymentStatus: 'cash received' })">Mark Cash Received</button>
                      <button onclick="updateBooking('${b.bookingId || b.id}', { bookingStatus: 'completed' })">Mark Completed</button>
                      <button onclick="updateBooking('${b.bookingId || b.id}', { paymentStatus: 'cash pending', bookingStatus: 'submitted' })">Reset</button>
                    </div>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } catch (e) {
        el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
      }
    }

    async function loadAll() {
      try {
        await loadSummary();
        await loadBookings();
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
