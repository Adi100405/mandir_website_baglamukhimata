<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 360px;
      text-align: center;
    }

    .login-box h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .login-box p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .login-box input:focus {
      outline: none;
      border-color: #6366f1;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    #login-error {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
    }

    #admin-panel {
      display: none;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
    }

    .logout-btn {
      background: #334155;
      border: none;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .logout-btn:hover {
      background: #475569;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card .label {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
    }

    .stat-card .value.green {
      color: #4ade80;
    }

    .stat-card .value.red {
      color: #f87171;
    }

    .stat-card .value.blue {
      color: #60a5fa;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      background: #1e293b;
      border-radius: 10px;
      padding: 4px;
      width: fit-content;
    }

    .tab {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tab.active {
      background: #6366f1;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .table-wrap {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .table-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .refresh-btn {
      background: #334155;
      border: none;
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .refresh-btn:hover {
      background: #475569;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #0f172a;
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 13px 16px;
      font-size: 14px;
      border-top: 1px solid #1e293b;
      background: #0f172a;
    }

    tr:hover td {
      background: #1e293b;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge.paid {
      background: #14532d;
      color: #4ade80;
    }

    .badge.failed {
      background: #450a0a;
      color: #f87171;
    }

    .loading {
      text-align: center;
      padding: 48px;
      color: #64748b;
    }

    .empty {
      text-align: center;
      padding: 48px;
      color: #64748b;
    }

    .amount {
      font-weight: 600;
      color: #4ade80;
    }

    @media (max-width: 900px) {
      .container {
        padding: 20px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        min-width: 900px;
      }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h1>🔐 Admin Panel</h1>
      <p>Enter your admin password to continue</p>
      <input type="password" id="password-input" placeholder="Admin password" />
      <button class="btn-primary" onclick="login()">Login</button>
      <p id="login-error"></p>
    </div>
  </div>

  <div id="admin-panel">
    <header>
      <h1>📊 Admin Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div class="container">
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Bookings</div><div class="value blue" id="stat-total-bookings">—</div></div>
        <div class="stat-card"><div class="label">Paid Bookings</div><div class="value green" id="stat-paid-bookings">—</div></div>
        <div class="stat-card"><div class="label">Failed Bookings</div><div class="value red" id="stat-failed-bookings">—</div></div>
        <div class="stat-card"><div class="label">Total Donations</div><div class="value blue" id="stat-total-donations">—</div></div>
        <div class="stat-card"><div class="label">Donation Amount</div><div class="value green" id="stat-donation-amount">—</div></div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab(event, 'bookings')">Bookings</button>
        <button class="tab" onclick="switchTab(event, 'donations')">Donations</button>
      </div>

      <div id="tab-bookings" class="tab-content active">
        <div class="table-wrap">
          <div class="table-header">
            <h2>All Bookings</h2>
            <button class="refresh-btn" onclick="loadBookings()">↻ Refresh</button>
          </div>
          <div id="bookings-body"><div class="loading">Loading bookings…</div></div>
        </div>
      </div>

      <div id="tab-donations" class="tab-content">
        <div class="table-wrap">
          <div class="table-header">
            <h2>Successful Donations</h2>
            <button class="refresh-btn" onclick="loadDonations()">↻ Refresh</button>
          </div>
          <div id="donations-body"><div class="loading">Loading donations…</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE = "https://mandir-website-baglamukhimata.onrender.com";
    let adminToken = "";

    async function login() {
      const pw = document.getElementById("password-input").value.trim();
      if (!pw) return;

      const res = await fetch(`${BASE}/admin/dashboard-summary`, {
        headers: { "x-admin-token": pw }
      });

      if (res.ok) {
        adminToken = pw;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        loadAll();
      } else {
        document.getElementById("login-error").textContent = "Wrong password. Try again.";
      }
    }

    document.getElementById("password-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    function logout() {
      adminToken = "";
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("admin-panel").style.display = "none";
      document.getElementById("password-input").value = "";
      document.getElementById("login-error").textContent = "";
    }

    function switchTab(e, tab) {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
      e.target.classList.add("active");
      document.getElementById(`tab-${tab}`).classList.add("active");
    }

    async function apiFetch(path) {
      const res = await fetch(`${BASE}${path}`, {
        headers: { "x-admin-token": adminToken }
      });

      if (!res.ok) {
        throw new Error(await res.text());
      }

      return res.json();
    }

    function fmtAmount(paise) {
      return "₹" + (Number(paise) / 100).toLocaleString("en-IN", {
        minimumFractionDigits: 2
      });
    }

    function badge(status) {
      const normalized = (status || "").toLowerCase();
      return `<span class="badge ${normalized}">${status || "—"}</span>`;
    }

    async function loadSummary() {
      try {
        const s = await apiFetch("/admin/dashboard-summary");
        document.getElementById("stat-total-bookings").textContent = s.totalBookings;
        document.getElementById("stat-paid-bookings").textContent = s.paidBookings;
        document.getElementById("stat-failed-bookings").textContent = s.failedBookings;
        document.getElementById("stat-total-donations").textContent = s.totalDonations;
        document.getElementById("stat-donation-amount").textContent =
          "₹" + Number(s.totalDonationAmount).toLocaleString("en-IN", { minimumFractionDigits: 2 });
      } catch (e) {
        console.error(e);
      }
    }

    async function loadBookings() {
      const el = document.getElementById("bookings-body");
      el.innerHTML = '<div class="loading">Loading…</div>';

      try {
        const data = await apiFetch("/admin/bookings");

        if (!data.items.length) {
          el.innerHTML = '<div class="empty">No bookings found.</div>';
          return;
        }

        el.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Pandit</th>
                <th>Location</th>
                <th>Amount</th>
                <th>Payment Status</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map((b) => `
                <tr>
                  <td>${b.name}</td>
                  <td>${b.phone}</td>
                  <td>${b.service}</td>
                  <td>${b.pandit}</td>
                  <td>${b.location}</td>
                  <td class="amount">${fmtAmount(b.amount)}</td>
                  <td>${badge(b.paymentStatus)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } catch (e) {
        el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
      }
    }

    async function loadDonations() {
      const el = document.getElementById("donations-body");
      el.innerHTML = '<div class="loading">Loading…</div>';

      try {
        const data = await apiFetch("/admin/donations");

        if (!data.items.length) {
          el.innerHTML = '<div class="empty">No donations found.</div>';
          return;
        }

        el.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map((d) => `
                <tr>
                  <td>${d.name}</td>
                  <td>${d.phone}</td>
                  <td class="amount">${fmtAmount(d.amount)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } catch (e) {
        el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
      }
    }

    function loadAll() {
      loadSummary();
      loadBookings();
      loadDonations();
    }
  </script>
</body>
</html>
