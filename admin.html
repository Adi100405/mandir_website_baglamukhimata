<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 360px;
      text-align: center;
    }
    .login-box h1 { font-size: 24px; margin-bottom: 8px; color: #f8fafc; }
    .login-box p  { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .login-box input:focus { outline: none; border-color: #6366f1; }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #4f46e5; }
    #login-error { color: #f87171; font-size: 13px; margin-top: 10px; }

    /* ── Layout ── */
    #admin-panel { display: none; }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #f8fafc; }
    header span { font-size: 13px; color: #94a3b8; }
    .logout-btn {
      background: #334155;
      border: none;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .logout-btn:hover { background: #475569; }

    .container { max-width: 1200px; margin: 0 auto; padding: 32px; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; margin-bottom: 28px; background: #1e293b; border-radius: 10px; padding: 4px; width: fit-content; }
    .tab {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab.active { background: #6366f1; color: white; }

    /* ── Stats Cards ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    .stat-card .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #f8fafc; }
    .stat-card .value.green { color: #4ade80; }
    .stat-card .value.red   { color: #f87171; }
    .stat-card .value.blue  { color: #60a5fa; }

    /* ── Table ── */
    .table-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
    .table-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .table-header h2 { font-size: 16px; font-weight: 600; }
    .refresh-btn {
      background: #334155;
      border: none;
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .refresh-btn:hover { background: #475569; }

    table { width: 100%; border-collapse: collapse; }
    th {
      background: #0f172a;
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { padding: 13px 16px; font-size: 14px; border-top: 1px solid #1e293b; }
    tr:hover td { background: #1e293b; }
    tr td { background: #0f172a; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.captured  { background: #14532d; color: #4ade80; }
    .badge.created   { background: #1e3a5f; color: #60a5fa; }
    .badge.failed    { background: #450a0a; color: #f87171; }
    .badge.attempted { background: #451a03; color: #fb923c; }
    .badge.paid      { background: #14532d; color: #4ade80; }
    .badge.refunded  { background: #3b1a6a; color: #c084fc; }

    .loading { text-align: center; padding: 48px; color: #64748b; }
    .empty   { text-align: center; padding: 48px; color: #64748b; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .amount { font-weight: 600; color: #4ade80; }
    .order-id { font-family: monospace; font-size: 13px; color: #94a3b8; }
    .method { color: #a5b4fc; }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin Panel</h1>
    <p>Enter your admin password to continue</p>
    <input type="password" id="password-input" placeholder="Admin password" />
    <button class="btn-primary" onclick="login()">Login</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- ── Admin ── -->
<div id="admin-panel">
  <header>
    <h1>📊 Admin Dashboard</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="env-badge"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="label">Total Orders</div><div class="value blue" id="stat-orders">—</div></div>
      <div class="stat-card"><div class="label">Total Payments</div><div class="value" id="stat-payments">—</div></div>
      <div class="stat-card"><div class="label">Successful</div><div class="value green" id="stat-success">—</div></div>
      <div class="stat-card"><div class="label">Failed</div><div class="value red" id="stat-failed">—</div></div>
      <div class="stat-card"><div class="label">Total Revenue</div><div class="value green" id="stat-revenue">—</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('orders')">Orders</button>
      <button class="tab" onclick="switchTab('payments')">Payments</button>
    </div>

    <!-- Orders Tab -->
    <div id="tab-orders" class="tab-content active">
      <div class="table-wrap">
        <div class="table-header">
          <h2>All Orders</h2>
          <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
        </div>
        <div id="orders-body"><div class="loading">Loading orders…</div></div>
      </div>
    </div>

    <!-- Payments Tab -->
    <div id="tab-payments" class="tab-content">
      <div class="table-wrap">
        <div class="table-header">
          <h2>All Payments</h2>
          <button class="refresh-btn" onclick="loadPayments()">↻ Refresh</button>
        </div>
        <div id="payments-body"><div class="loading">Loading payments…</div></div>
      </div>
    </div>

  </div>
</div>

<script>
  const BASE = "https://mandir-website-baglamukhimata.onrender.com";
  let adminToken = "";

  async function login() {
    const pw = document.getElementById("password-input").value;
    if (!pw) return;

    // Test the password against a real admin route
    const res = await fetch(`${BASE}/admin/stats`, {
      headers: { "x-admin-token": pw }
    });

    if (res.ok) {
      adminToken = pw;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      loadAll();
    } else {
      document.getElementById("login-error").textContent = "Wrong password. Try again.";
    }
  }

  document.getElementById("password-input").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
  });

  function logout() {
    adminToken = "";
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("admin-panel").style.display = "none";
    document.getElementById("password-input").value = "";
  }

  function switchTab(tab) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById(`tab-${tab}`).classList.add("active");
  }

  async function apiFetch(path) {
    const res = await fetch(`${BASE}${path}`, {
      headers: { "x-admin-token": adminToken }
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function fmtAmount(paise) {
    return "₹" + (paise / 100).toLocaleString("en-IN", { minimumFractionDigits: 2 });
  }

  function fmtDate(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toLocaleString("en-IN");
  }

  function badge(status) {
    return `<span class="badge ${status?.toLowerCase()}">${status || "—"}</span>`;
  }

  async function loadStats() {
    try {
      const s = await apiFetch("/admin/stats");
      document.getElementById("stat-orders").textContent   = s.totalOrders;
      document.getElementById("stat-payments").textContent = s.totalPayments;
      document.getElementById("stat-success").textContent  = s.capturedPayments;
      document.getElementById("stat-failed").textContent   = s.failedPayments;
      document.getElementById("stat-revenue").textContent  = "₹" + s.totalRevenue.toLocaleString("en-IN");

      // Detect test mode from key
      const env = adminToken && s.totalRevenue !== undefined ? "" : "";
      document.getElementById("env-badge").textContent = "🟡 Test Mode";
    } catch(e) { console.error(e); }
  }

  async function loadOrders() {
    const el = document.getElementById("orders-body");
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      const data = await apiFetch("/admin/orders?count=50");
      if (!data.items.length) { el.innerHTML = '<div class="empty">No orders found.</div>'; return; }

      el.innerHTML = `<table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Payment Status</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody>
          ${data.items.map(o => {
            const pmt = o.payments?.[0];
            return `<tr>
              <td class="order-id">${o.id}</td>
              <td class="amount">${fmtAmount(o.amount)}</td>
              <td>${badge(o.status)}</td>
              <td>${pmt ? badge(pmt.status) : '<span style="color:#64748b">No payment</span>'}</td>
              <td style="color:#94a3b8">${fmtDate(o.created_at)}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
    } catch(e) {
      el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
    }
  }

  async function loadPayments() {
    const el = document.getElementById("payments-body");
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      const data = await apiFetch("/admin/payments?count=50");
      if (!data.items.length) { el.innerHTML = '<div class="empty">No payments found.</div>'; return; }

      el.innerHTML = `<table>
        <thead>
          <tr>
            <th>Payment ID</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Method</th>
            <th>Email / Contact</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          ${data.items.map(p => `<tr>
            <td class="order-id">${p.id}</td>
            <td class="amount">${fmtAmount(p.amount)}</td>
            <td>${badge(p.status)}</td>
            <td class="method">${p.method || "—"}</td>
            <td style="color:#94a3b8; font-size:13px">${p.email || "—"}<br>${p.contact || ""}</td>
            <td style="color:#94a3b8">${fmtDate(p.created_at)}</td>
          </tr>`).join("")}
        </tbody>
      </table>`;
    } catch(e) {
      el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
    }
  }

  function loadAll() {
    loadStats();
    loadOrders();
    loadPayments();
  }
</script>
</body>
</html>
